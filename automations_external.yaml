        - switch.guest_bath_towel_warmer
        - switch.master_bath_towel_warmer

# Arm alarm 10 minutes after leaving
- id: ArmWhenLeaving
  alias: Arm Alarm when Leaving
  description: Arm Alarm when Leaving

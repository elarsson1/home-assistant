# =============================================================================
# Heat stage controller - PACKAGE
# Design: docs/heat_stage_controller_design.md
#
# Everything the controller needs: its helpers, its scripts and its automation.
# Loaded by `homeassistant: packages: !include_dir_named packages` in
# configuration.yaml.
#
# Helpers deliberately have no `initial:` so Home Assistant restores their
# last value across restarts.
# =============================================================================

input_boolean:
  hsc_living_room_enabled:
    name: "HSC Living Room Enabled"
  hsc_den_enabled:
    name: "HSC Den Enabled"

input_select:
  hsc_living_room_stage:
    name: "HSC Living Room Stage"
    options:
      - radiant_only
      - recovery
      - boost
      - assist
  hsc_den_stage:
    name: "HSC Den Stage"
    options:
      - radiant_only
      - recovery
      - boost
      - assist

input_datetime:
  hsc_living_room_stage_since:
    name: "HSC Living Room Stage Since"
    has_date: true
    has_time: true
  hsc_living_room_last_short:
    name: "HSC Living Room Last Short"
    has_date: true
    has_time: true
  hsc_den_stage_since:
    name: "HSC Den Stage Since"
    has_date: true
    has_time: true
  hsc_den_last_short:
    name: "HSC Den Last Short"
    has_date: true
    has_time: true

input_number:
  hsc_living_room_integral:
    name: "HSC Living Room Integral"
    min: -1000
    max: 1000
    step: 0.1
    mode: box
    unit_of_measurement: "°F·min"
  hsc_living_room_floor_level:
    name: "HSC Living Room Floor Level"
    min: 0
    max: 100
    step: 0.01
    mode: box
    unit_of_measurement: "°F"
  hsc_living_room_hp_offset:
    name: "HSC Living Room HP Offset"
    min: -3
    max: 3
    step: 0.01
    mode: box
    unit_of_measurement: "°F"
  hsc_den_integral:
    name: "HSC Den Integral"
    min: -1000
    max: 1000
    step: 0.1
    mode: box
    unit_of_measurement: "°F·min"
  hsc_den_floor_level:
    name: "HSC Den Floor Level"
    min: 0
    max: 100
    step: 0.01
    mode: box
    unit_of_measurement: "°F"
  hsc_den_hp_offset:
    name: "HSC Den HP Offset"
    min: -3
    max: 3
    step: 0.01
    mode: box
    unit_of_measurement: "°F"

script:
  # =============================================================================
  # Heat stage controller - SCRIPTS
  #
  # Small helpers used by the "Heat stage controller" automation. Each one only
  # writes to a device or helper when the value actually needs to change.
  # =============================================================================

  # Record a stage change: set the stage, stamp the time, and set the integrator
  # (to 0 unless an "integral" value is passed).
  hsc_set_stage:
    alias: "HSC: set stage"
    mode: queued
    fields:
      zone_id:
        description: Zone id used in the helper names, e.g. living_room
        required: true
      stage:
        description: radiant_only, recovery, boost or assist
        required: true
      integral:
        description: Integrator value to start the new stage with (default 0)
        required: false
    sequence:
      - action: input_select.select_option
        target:
          entity_id: "input_select.hsc_{{ zone_id }}_stage"
        data:
          option: "{{ stage }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.hsc_{{ zone_id }}_stage_since"
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_number.set_value
        target:
          entity_id: "input_number.hsc_{{ zone_id }}_integral"
        data:
          value: "{{ integral | default(0) }}"

  # Put the heat pump in the wanted mode and, when heating, at the wanted setpoint.
  hsc_set_heat_pump:
    alias: "HSC: set heat pump"
    mode: queued
    fields:
      heat_pump:
        description: Heat pump climate entity
        required: true
      mode:
        description: heat or off
        required: true
      setpoint:
        description: Heat pump setpoint in F (only used when mode is heat)
        required: false
    sequence:
      # Only act when the heat pump is in heat or off. If it is offline, or
      # someone put it in cool, dry or fan, leave it alone.
      - condition: template
        value_template: "{{ states(heat_pump) in ['heat', 'off'] }}"

      - if:
          - "{{ states(heat_pump) != mode }}"
        then:
          - action: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: "{{ heat_pump }}"
            data:
              hvac_mode: "{{ mode }}"
          # Give the unit a moment before sending the setpoint
          - delay: 5

      - if:
          - "{{ mode == 'heat' }}"
          - "{{ state_attr(heat_pump, 'temperature') | float(-99) != setpoint | float }}"
        then:
          - action: climate.set_temperature
            continue_on_error: true
            target:
              entity_id: "{{ heat_pump }}"
            data:
              temperature: "{{ setpoint | int }}"

  # Set the tekmar floor minimum (0 disables it).
  hsc_set_floor_minimum:
    alias: "HSC: set floor minimum"
    mode: queued
    fields:
      floor:
        description: tekmar floor climate entity
        required: true
      floor_minimum:
        description: Floor minimum in F; 0 disables it
        required: true
    sequence:
      - condition: template
        value_template: "{{ state_attr(floor, 'temperature') | float(-1) != floor_minimum | float }}"
      - action: climate.set_temperature
        continue_on_error: true
        target:
          entity_id: "{{ floor }}"
        data:
          temperature: "{{ floor_minimum | int }}"

automation:
  # =============================================================================
  # Heat stage controller - AUTOMATION
  # Design: docs/heat_stage_controller_design.md
  #
  # Coordinates each zone's radiant floor (tekmar) and heat pump (Mitsubishi).
  #
  # The tekmar air setpoint is the single source of truth and is never written
  # here. The controller only writes:
  #   - the tekmar floor minimum
  #   - the heat pump's mode and setpoint
  #
  # Stages (stored in input_select.hsc_<zone>_stage):
  #   radiant_only  Radiant runs on the tekmar's own air control. Floor minimum
  #                 is always 0 here. Heat pump is off (or resting in
  #                 freeze-risk weather).
  #   boost         The floor minimum is under management by an outer PI loop
  #                 on room temperature (the tekmar's own floor control is
  #                 the inner loop). Heat pump is off. This is a long-lived
  #                 state.
  #   assist        Boost alone is not holding the room. The heat pump is armed
  #                 and follows the tekmar reading: a small call for heat while
  #                 the room reads short, satisfied otherwise. Ends once the
  #                 room has not read short for a while.
  #   recovery      Room is well below setpoint (setback recovery). Heat pump
  #                 runs to 1 F short of setpoint; the radiant finishes the rest.
  #
  # Two accumulators per zone are fed by the same error x minutes:
  #   floor level         the learned floor temperature that holds the room at
  #                       setpoint (the "I" term of the floor loop). It is a
  #                       real memory: it is NOT tied to the current floor
  #                       reading, and it only learns on valid evidence.
  #   staging integrator  degree-minutes of shortfall; drives the stage changes
  #
  # Uses the three small scripts below in this package:
  #   script.hsc_set_stage, script.hsc_set_heat_pump, script.hsc_set_floor_minimum
  # =============================================================================

  - id: hsc_heat_stage_controller
    alias: Heat stage controller
    # Queued, so every change of a reading or setpoint gets its own run. Step 3
    # relies on this: it credits the minutes since the last run to the value
    # from before the change that triggered the run.
    mode: queued
    max: 5
    max_exceeded: silent

    triggers:
      - trigger: time_pattern
        minutes: "/5"
      # React right away to a setpoint change at the wall or from a preset
      - trigger: state
        entity_id:
          - climate.living_room_radiant
          - climate.den_radiant
        attribute: temperature
      # React right away when the room reading changes, so the heat pump is
      # cut as soon as the room reaches setpoint (not up to 5 minutes later)
      - trigger: state
        entity_id:
          - sensor.living_room_radiant_temperature
          - sensor.den_radiant_temperature
      - trigger: homeassistant
        event: start

    variables:
      unavailable_states: ["unknown", "unavailable", "none", "None", ""]

      # Minutes since this automation last ran. Used to accumulate
      # degree-minutes. Capped at 10 so an outage cannot add a large amount.
      minutes_since_last_run: >-
        {% set last_run = this.attributes.last_triggered %}
        {{ [((now() - last_run).total_seconds() / 60) if last_run else 5, 10] | min | round(2) }}

      zones:
        - id: living_room
          heat_pump: climate.living_room
          radiant: climate.living_room_radiant
          floor: climate.living_room_radiant_floor
          room_temp: sensor.living_room_radiant_temperature    # tekmar air reading
          outdoor_temp: sensor.outside_gw3000b_outdoor_temp_24h_average
          # --- tunables ---
          freeze_protect_outdoor_temp: 30   # below this, an idle heat pump rests in heat mode
          rest_droop: 2                     # ...this many F below setpoint
          recovery_start_error: 2           # enter recovery when room is this far below setpoint
          recovery_stop_error: 1            # recovery stops this far short of setpoint
          min_minutes_recovery: 15          # minimum time in recovery
          min_minutes_heat_pump_off: 15     # minimum off time before the heat pump may start
          boost_start_degree_minutes: 30    # shortfall that starts boost
          assist_start_degree_minutes: 60   # weighted shortfall, in boost, that arms the heat pump
          assist_carry_degree_minutes: 30   # integrator value on leaving assist (see step 7); keep below assist_start
          integral_decay_at_setpoint: 0.25  # degree-minutes lost per minute at setpoint
          staging_integrator_minimum: -30   # most excess the staging integrator will remember
          assist_hold_minutes: 20           # assist ends this long after the room last read short
          assist_call_delta: 1              # heat pump setpoint offset from its own reading in assist
          level_settling_minutes: 45        # floor level does not learn for this long after boost starts
          integral_minutes_per_degree: 90   # floor level moves 1 F per this many degree-minutes of error
          floor_behind_margin: 1            # floor this far under the level = radiant is behind
          learning_shortfall_weight: 0.5    # weight of shortfall toward assist while the level is learning upward
          floor_stop_holding_error: 2       # room this far over setpoint: stop holding the floor
          floor_proportional_step: 1        # floor minimum nudge (F) while the room reads short or over
          floor_max_lead: 1                 # floor minimum is never more than this above the measured floor
          floor_max_lag: 2                  # ...or more than this below it
          boost_release_minutes: 180        # boost may end after this long without a short reading
          offset_learning_rate: 0.05        # weight of a new reading in the offset average, per 5 minutes
          offset_max_deviation: 3           # ignore heat pump readings further than this from where we expect them

        - id: den
          heat_pump: climate.den
          radiant: climate.den_radiant
          floor: climate.den_radiant_floor
          room_temp: sensor.den_radiant_temperature            # tekmar air reading
          outdoor_temp: sensor.outside_gw3000b_outdoor_temp_24h_average
          # --- tunables ---
          freeze_protect_outdoor_temp: -20
          rest_droop: 2
          recovery_start_error: 2
          recovery_stop_error: 1
          min_minutes_recovery: 15
          min_minutes_heat_pump_off: 15
          boost_start_degree_minutes: 30
          assist_start_degree_minutes: 60
          assist_carry_degree_minutes: 30
          integral_decay_at_setpoint: 0.25
          staging_integrator_minimum: -30
          assist_hold_minutes: 20
          assist_call_delta: 1
          level_settling_minutes: 45
          integral_minutes_per_degree: 90
          floor_behind_margin: 1
          learning_shortfall_weight: 0.5
          floor_stop_holding_error: 2
          floor_proportional_step: 1
          floor_max_lead: 1
          floor_max_lag: 2
          boost_release_minutes: 180
          offset_learning_rate: 0.05
          offset_max_deviation: 3

    actions:
      - repeat:
          for_each: "{{ zones }}"
          sequence:

            # -----------------------------------------------------------------
            # 1. Read everything this zone needs
            # -----------------------------------------------------------------
            - variables:
                zone: "{{ repeat.item }}"
                enabled_entity: "input_boolean.hsc_{{ repeat.item.id }}_enabled"
                stage_entity: "input_select.hsc_{{ repeat.item.id }}_stage"
                stage_since_entity: "input_datetime.hsc_{{ repeat.item.id }}_stage_since"
                last_short_entity: "input_datetime.hsc_{{ repeat.item.id }}_last_short"
                integral_entity: "input_number.hsc_{{ repeat.item.id }}_integral"
                floor_level_entity: "input_number.hsc_{{ repeat.item.id }}_floor_level"
                offset_entity: "input_number.hsc_{{ repeat.item.id }}_hp_offset"

            - variables:
                radiant_mode: "{{ states(zone.radiant) }}"
                heat_pump_mode: "{{ states(zone.heat_pump) }}"
                floor_state: "{{ states(zone.floor) }}"
                stage: "{{ states(stage_entity) }}"

                setpoint: "{{ state_attr(zone.radiant, 'temperature') }}"
                room_temp: "{{ states(zone.room_temp) }}"
                heat_pump_reading: "{{ state_attr(zone.heat_pump, 'current_temperature') }}"
                floor_temp: "{{ state_attr(zone.floor, 'current_temperature') }}"
                floor_cap: "{{ state_attr(zone.floor, 'max_temp') }}"
                floor_minimum_now: "{{ state_attr(zone.floor, 'temperature') }}"

                # These fall back to a neutral value if missing
                outdoor_temp: "{{ states(zone.outdoor_temp) }}"
                integral: "{{ states(integral_entity) | float(0) }}"
                heat_pump_offset: "{{ states(offset_entity) | float(0) }}"

            - variables:
                devices_available: >-
                  {{ radiant_mode not in unavailable_states
                     and heat_pump_mode not in unavailable_states
                     and floor_state not in unavailable_states
                     and stage in ['radiant_only', 'recovery', 'boost', 'assist'] }}
                readings_valid: >-
                  {{ is_number(setpoint) and is_number(room_temp)
                     and is_number(floor_temp) and is_number(floor_cap)
                     and is_number(floor_minimum_now) }}

            # -----------------------------------------------------------------
            # 2. Decide whether to act on this zone at all
            # -----------------------------------------------------------------
            - choose:

                # Controller disabled, or a device is offline: do nothing this
                # run. Devices keep their last (sane) settings.
                - conditions:
                    - "{{ not is_state(enabled_entity, 'on') or not devices_available }}"
                  sequence: []

                # Radiant thermostat is off (summer): release the floor minimum
                # and reset the stage. The heat pump is left alone, unless the
                # controller itself had it running (assist or recovery); then
                # it is turned off so it is not left heating with nothing
                # supervising it.
                - conditions:
                    - "{{ radiant_mode != 'heat' }}"
                  sequence:
                    - if:
                        - "{{ stage in ['assist', 'recovery'] }}"
                      then:
                        - action: script.hsc_set_heat_pump
                          data:
                            heat_pump: "{{ zone.heat_pump }}"
                            mode: "off"
                    - action: script.hsc_set_floor_minimum
                      data:
                        floor: "{{ zone.floor }}"
                        floor_minimum: 0
                    - if:
                        - "{{ stage != 'radiant_only' }}"
                      then:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: radiant_only

                # A reading is missing: skip this run and try again next time.
                - conditions:
                    - "{{ not readings_valid }}"
                  sequence: []

              # Normal case: run the controller
              default:

                # -------------------------------------------------------------
                # 3. Derived values
                # -------------------------------------------------------------
                - variables:
                    # Positive error = room is below setpoint
                    error: "{{ setpoint - room_temp }}"

                    minutes_in_stage: >-
                      {% set since = states(stage_since_entity) %}
                      {{ ((now() - (since | as_datetime | as_local)).total_seconds() / 60)
                         if since not in unavailable_states else 9999 }}

                    # Minutes since the room last read 1 F or more below setpoint
                    minutes_since_last_short: >-
                      {% set last_short = states(last_short_entity) %}
                      {{ ((now() - (last_short | as_datetime | as_local)).total_seconds() / 60)
                         if last_short not in unavailable_states else 9999 }}

                    # The heat pump may be started if it is already in heat mode
                    # (resting), or has been off long enough.
                    heat_pump_can_start: >-
                      {{ heat_pump_mode == 'heat'
                         or (now() - states[zone.heat_pump].last_changed).total_seconds() / 60
                            >= zone.min_minutes_heat_pump_off }}

                    # The heat pump reads from a wireless MHK2 thermostat. If
                    # that link drops, the unit falls back to its internal
                    # sensor, which can be far off. We expect the reading at
                    # the room reading plus the learned offset; a reading more
                    # than offset_max_deviation away from that is treated as
                    # the fallback and not trusted.
                    # (If the true offset ever moved by more than that from the
                    # learned one, readings would stay untrusted and the offset
                    # could not relearn. That would point to a sensor problem;
                    # set the offset helper by hand to recover.)
                    heat_pump_reading_trusted: >-
                      {{ is_number(heat_pump_reading)
                         and (heat_pump_reading - (room_temp + heat_pump_offset)) | abs
                             <= zone.offset_max_deviation }}

                    # Which entity's change triggered this run ('' on a
                    # 5-minute tick or at start-up)
                    triggering_entity: "{{ trigger.entity_id | default('') }}"

                # The readings that applied over the minutes since the last run.
                # When a change of this zone's room reading or setpoint
                # triggered the run, those minutes were spent at the value from
                # BEFORE the change, so that is the value to integrate. On a
                # 5-minute tick, or when the other zone triggered the run,
                # nothing changed here and the current values apply.
                - variables:
                    interval_room_temp: >-
                      {{ trigger.from_state.state
                         if (triggering_entity == zone.room_temp
                             and is_number(trigger.from_state.state))
                         else room_temp }}
                    interval_setpoint: >-
                      {{ trigger.from_state.attributes.temperature
                         if (triggering_entity == zone.radiant
                             and is_number(trigger.from_state.attributes.temperature))
                         else setpoint }}

                - variables:
                    # Positive = the room was below setpoint over the interval
                    interval_error: "{{ interval_setpoint - interval_room_temp }}"

                # Values for the floor loop (steps 6 and 8a)
                - variables:
                    # Degree-minutes of error since the last run. Zero while
                    # the room read at setpoint.
                    error_increment: >-
                      {{ (interval_error * minutes_since_last_run)
                         if (interval_error >= 1 or interval_error <= -1) else 0 }}

                    # The learned floor level. If it has never been set, start
                    # from the measured floor temperature.
                    floor_level: >-
                      {{ states(floor_level_entity) | float(0)
                         if states(floor_level_entity) | float(0) > 0 else floor_temp }}

                    # The floor minimum is kept close to the measured floor so
                    # the tekmar's own floor control keeps modulating. Further
                    # above than this and it calls continuously; further below
                    # and it contributes nothing.
                    floor_upper_limit: "{{ [floor_temp + zone.floor_max_lead, floor_cap] | min }}"
                    floor_lower_limit: "{{ floor_temp - zone.floor_max_lag }}"

                - variables:
                    # The radiant is "behind" when the floor is well under the
                    # learned level (it is still climbing toward what we know
                    # it needs), or when the floor is at its cap. Used for the
                    # shortfall weight in step 6.
                    radiant_behind: >-
                      {{ floor_temp <= floor_level - zone.floor_behind_margin
                         or floor_temp >= floor_cap - 1 }}

                    # The level learns only on valid evidence:
                    #   - in boost, and not for the first level_settling_minutes
                    #     of a boost period. Coming from assist or recovery the
                    #     room still holds the heat pump's heat, which is not
                    #     the radiant's doing; coming from radiant only, the
                    #     room has not yet responded to the floor (about 45
                    #     minutes of dead time).
                    #   - the room was off by 1 F, not more. Bigger gaps are
                    #     disturbances (the fireplace, a setback, an open
                    #     door) and say nothing about the level.
                    floor_level_may_learn: >-
                      {{ stage == 'boost'
                         and minutes_in_stage >= zone.level_settling_minutes
                         and interval_error | abs >= 1 and interval_error | abs < 2 }}

                - variables:
                    # The level is learning UPWARD: the room was short by 1 F
                    # and the floor has reached the level (or is above it), so
                    # the level is too low. While the floor is still climbing
                    # toward the level, the level holds; otherwise it would run
                    # away upward.
                    floor_level_learning_upward: >-
                      {{ floor_level_may_learn
                         and interval_error >= 1
                         and floor_temp > floor_level - zone.floor_behind_margin }}

                # -------------------------------------------------------------
                # 4. Learn the heat pump's sensor offset
                #    (heat pump reading minus room reading, slow running
                #    average). Used for the recovery and freeze-rest setpoints.
                # -------------------------------------------------------------
                - if:
                    - "{{ heat_pump_reading_trusted }}"
                  then:
                    - variables:
                        # offset_learning_rate is the weight of a new reading
                        # per 5 minutes. Scale it by the time actually elapsed,
                        # so extra runs (a flickering reading) do not make the
                        # average adapt faster.
                        offset_weight: >-
                          {{ [zone.offset_learning_rate * minutes_since_last_run / 5, 1] | min }}
                    - variables:
                        blended_offset: >-
                          {{ heat_pump_offset
                             + offset_weight * ((heat_pump_reading - room_temp) - heat_pump_offset) }}
                    - action: input_number.set_value
                      target:
                        entity_id: "{{ offset_entity }}"
                      data:
                        value: "{{ [[blended_offset, -3] | max, 3] | min | round(2) }}"

                # -------------------------------------------------------------
                # 5. Remember when the room last read short
                # -------------------------------------------------------------
                - if:
                    - "{{ error >= 1 }}"
                  then:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: "{{ last_short_entity }}"
                      data:
                        timestamp: "{{ now().timestamp() }}"

                # -------------------------------------------------------------
                # 6. Integrate the error: one increment, two accumulators
                #    (the increment is the error that applied over the minutes
                #    since the last run; see interval_error in step 3)
                #
                #    Floor level (F): the floor temperature that holds the room
                #    at setpoint. It moves 1 F per integral_minutes_per_degree
                #    of error. It stays between the room setpoint and the floor
                #    cap, never leaks, and is not tied to the current floor
                #    reading, so it survives an evening with the fireplace on or
                #    a cooking spell.
                #
                #    Staging integrator (degree-minutes, signed):
                #    shortfall counted toward arming the heat pump. Time over
                #    setpoint works it back down and a little below zero, so a
                #    room that has just been over is slower to escalate. The
                #    negative side is capped at staging_integrator_minimum, so
                #    a long warm spell cannot build up a large debt that would
                #    delay the heat pump. Shortfall counts at reduced weight
                #    only while the floor level is actually learning upward
                #    (the floor loop is still working on the problem), and in
                #    full whenever it is not: the radiant is behind, the level
                #    is paused after a stage change, or the floor is at its
                #    cap. While the room reads at setpoint it leaks slowly
                #    toward zero.
                # -------------------------------------------------------------
                - choose:

                    # Room short by 1 F, and the floor has reached the level
                    # (or is above it): the level is too low. If the floor is
                    # already above the level, start from the floor reading.
                    - conditions:
                        - "{{ floor_level_learning_upward }}"
                      sequence:
                        - variables:
                            level_start: "{{ [floor_level, floor_temp] | max }}"
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ floor_level_entity }}"
                          data:
                            value: >-
                              {{ [level_start + error_increment / zone.integral_minutes_per_degree, floor_cap] | min | round(2) }}

                    # Room over by 1 F: the level is too high. It comes down
                    # at the same slow rate wherever the floor is. (There is
                    # no jump down to the floor reading: after the fireplace has
                    # been on, the floor is well below the level while the room
                    # passes back through "1 F over", and that must not erase
                    # the level.)
                    - conditions:
                        - "{{ floor_level_may_learn }}"
                        - "{{ interval_error <= -1 }}"
                      sequence:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ floor_level_entity }}"
                          data:
                            value: >-
                              {{ [floor_level + error_increment / zone.integral_minutes_per_degree, setpoint] | max | round(2) }}

                    # Otherwise the level holds.

                - variables:
                    # Shortfall counts at reduced weight only while the level
                    # is learning upward. Whenever the level cannot learn, the
                    # floor loop has nothing more to offer and the shortfall
                    # counts in full toward the heat pump.
                    # (At the floor cap the level has no room left to rise,
                    # so that also counts in full.)
                    staging_increment: >-
                      {{ error_increment * zone.learning_shortfall_weight
                         if (floor_level_learning_upward and not radiant_behind)
                         else error_increment }}

                # Update the staging integrator
                - choose:

                    # Room was 1 F or more away from setpoint, either side
                    - conditions:
                        - "{{ error_increment != 0 }}"
                      sequence:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ integral_entity }}"
                          data:
                            value: >-
                              {{ [[integral + staging_increment, 1000] | min, zone.staging_integrator_minimum] | max | round(1) }}

                  # At setpoint: leak toward zero from either side
                  default:
                    - variables:
                        leak: "{{ zone.integral_decay_at_setpoint * minutes_since_last_run }}"
                    - if:
                        - "{{ integral != 0 }}"
                      then:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ integral_entity }}"
                          data:
                            value: >-
                              {{ ([integral - leak, 0] | max if integral > 0
                                  else [integral + leak, 0] | min) | round(1) }}

                # Re-read the integrator after the update
                - variables:
                    integral: "{{ states(integral_entity) | float(0) }}"

                # -------------------------------------------------------------
                # 7. Stage transitions (first matching rule wins).
                #    script.hsc_set_stage sets the integrator to 0 unless an
                #    "integral" value is passed.
                # -------------------------------------------------------------
                - choose:

                    # RADIANT ONLY or BOOST -> RECOVERY
                    # Room is well below setpoint, e.g. back from setback.
                    - conditions:
                        - "{{ stage in ['radiant_only', 'boost'] }}"
                        - "{{ error >= zone.recovery_start_error }}"
                        - "{{ heat_pump_can_start }}"
                      sequence:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: recovery

                    # RADIANT ONLY -> BOOST
                    # Room has been persistently short on the tekmar's own
                    # control. Start managing the floor minimum, with the
                    # learned level starting at the current floor reading.
                    - conditions:
                        - "{{ stage == 'radiant_only' }}"
                        - "{{ integral >= zone.boost_start_degree_minutes }}"
                      sequence:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ floor_level_entity }}"
                          data:
                            value: "{{ floor_temp }}"
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: boost

                    # RECOVERY -> BOOST
                    # Recovery is done and a floor minimum was already being
                    # managed when it started (recovery does not touch it).
                    - conditions:
                        - "{{ stage == 'recovery' }}"
                        - "{{ error <= zone.recovery_stop_error }}"
                        - "{{ minutes_in_stage >= zone.min_minutes_recovery }}"
                        - "{{ floor_minimum_now > 0 }}"
                      sequence:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: boost

                    # RECOVERY -> RADIANT ONLY
                    # Recovery is done and no floor minimum was in use.
                    - conditions:
                        - "{{ stage == 'recovery' }}"
                        - "{{ error <= zone.recovery_stop_error }}"
                        - "{{ minutes_in_stage >= zone.min_minutes_recovery }}"
                      sequence:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: radiant_only

                    # BOOST -> ASSIST
                    # The room has stayed short. This comes sooner when the
                    # radiant is behind (floor well under the learned level,
                    # or at its cap) than when the floor is at the level.
                    - conditions:
                        - "{{ stage == 'boost' }}"
                        - "{{ error >= 1 }}"
                        - "{{ integral >= zone.assist_start_degree_minutes }}"
                        - "{{ heat_pump_can_start }}"
                      sequence:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: assist

                    # ASSIST -> BOOST
                    # The room has not read short for a while, so the heat pump
                    # is not needed. If the radiant is maxed out the room reads
                    # short again within the hold time and assist simply
                    # continues.
                    # The integrator restarts at the carry value, not 0: if the
                    # room sags again soon, the heat pump comes back quickly;
                    # if the room holds, that memory leaks away.
                    - conditions:
                        - "{{ stage == 'assist' }}"
                        - "{{ error < 1 }}"
                        - "{{ minutes_since_last_short >= zone.assist_hold_minutes }}"
                      sequence:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: boost
                            integral: "{{ zone.assist_carry_degree_minutes }}"

                    # BOOST -> RADIANT ONLY
                    # The tekmar is doing well on its own: the room has not
                    # read short for a long time, and the floor minimum is
                    # under the measured floor, so it is not what is holding
                    # the floor up. (If the room is fine BECAUSE the minimum is
                    # holding the floor up, boost is doing its job and
                    # continues.) The learned level starts afresh the next time
                    # boost is entered.
                    - conditions:
                        - "{{ stage == 'boost' }}"
                        - "{{ error < 1 }}"
                        - "{{ minutes_since_last_short >= zone.boost_release_minutes }}"
                        - "{{ floor_minimum_now < floor_temp }}"
                      sequence:
                        - action: script.hsc_set_stage
                          data:
                            zone_id: "{{ zone.id }}"
                            stage: radiant_only

                # -------------------------------------------------------------
                # 8. Apply outputs for the stage we are in now.
                #    Stage, offset, integrator and floor level are re-read
                #    because the steps above may have just changed them.
                # -------------------------------------------------------------
                - variables:
                    stage: "{{ states(stage_entity) }}"
                    heat_pump_offset: "{{ states(offset_entity) | float(0) }}"
                    integral: "{{ states(integral_entity) | float(0) }}"
                    floor_level: >-
                      {{ states(floor_level_entity) | float(0)
                         if states(floor_level_entity) | float(0) > 0 else floor_temp }}

                # ---- 8a. Floor minimum ----
                - choose:

                    # RADIANT ONLY: floor minimum is always disabled and the
                    # tekmar runs on its own air control.
                    - conditions:
                        - "{{ stage == 'radiant_only' }}"
                      sequence:
                        - action: script.hsc_set_floor_minimum
                          data:
                            floor: "{{ zone.floor }}"
                            floor_minimum: 0

                    # RECOVERY: leave the floor minimum exactly as it is.
                    - conditions:
                        - "{{ stage == 'recovery' }}"
                      sequence: []

                    # BOOST or ASSIST, room well over setpoint (the fireplace, cooking,
                    # sun): stop holding the floor. The learned level is kept.
                    - conditions:
                        - "{{ error <= -zone.floor_stop_holding_error }}"
                      sequence:
                        - action: script.hsc_set_floor_minimum
                          data:
                            floor: "{{ zone.floor }}"
                            floor_minimum: "{{ floor_lower_limit | round(0) | int }}"

                  # BOOST or ASSIST: the floor loop.
                  #   floor minimum = learned level (I)
                  #                 + a nudge while the room reads short or over (P)
                  # limited to a window around the measured floor so the tekmar
                  # keeps modulating. When the level is far above the floor,
                  # that means the top of the window: push.
                  default:
                    - variables:
                        proportional_nudge: >-
                          {{ zone.floor_proportional_step if error >= 1
                             else (-zone.floor_proportional_step if error <= -1 else 0) }}
                    - variables:
                        # While the room reads over, never ask for more than
                        # 1 F under the measured floor, whatever the level says.
                        upper_limit_now: "{{ (floor_temp - 1) if error <= -1 else floor_upper_limit }}"
                    - variables:
                        floor_minimum_wanted: >-
                          {{ [[floor_level + proportional_nudge, floor_lower_limit] | max, upper_limit_now] | min }}
                    # The thermostat takes whole degrees
                    - action: script.hsc_set_floor_minimum
                      data:
                        floor: "{{ zone.floor }}"
                        floor_minimum: "{{ floor_minimum_wanted | round(0) | int }}"

                # ---- 8b. Heat pump ----
                - choose:

                    # RECOVERY: run to just short of setpoint
                    - conditions:
                        - "{{ stage == 'recovery' }}"
                      sequence:
                        - action: script.hsc_set_heat_pump
                          data:
                            heat_pump: "{{ zone.heat_pump }}"
                            mode: heat
                            setpoint: "{{ (setpoint - zone.recovery_stop_error + heat_pump_offset) | round(0) | int }}"

                    # ASSIST, room short: a small call for heat. The setpoint is
                    # set just above the heat pump's own reading, so the tekmar
                    # reading decides when it heats and the gap stays small
                    # enough for it to modulate. If its reading cannot be
                    # trusted, fall back to setpoint plus the learned offset.
                    - conditions:
                        - "{{ stage == 'assist' }}"
                        - "{{ error >= 1 }}"
                      sequence:
                        - action: script.hsc_set_heat_pump
                          data:
                            heat_pump: "{{ zone.heat_pump }}"
                            mode: heat
                            setpoint: >-
                              {{ ((heat_pump_reading + zone.assist_call_delta) if heat_pump_reading_trusted
                                  else (setpoint + heat_pump_offset)) | round(0) | int }}

                    # ASSIST, room at or above setpoint: satisfied. The setpoint
                    # is set just below the heat pump's own reading so it stops
                    # heating but stays armed in heat mode.
                    - conditions:
                        - "{{ stage == 'assist' }}"
                      sequence:
                        - action: script.hsc_set_heat_pump
                          data:
                            heat_pump: "{{ zone.heat_pump }}"
                            mode: heat
                            setpoint: >-
                              {{ ((heat_pump_reading - zone.assist_call_delta) if heat_pump_reading_trusted
                                  else (setpoint + heat_pump_offset - 2)) | round(0) | int }}

                  # RADIANT ONLY or BOOST: heat pump is not needed
                  default:
                    - variables:
                        # 2 F of hysteresis so the heat pump does not flip
                        # between resting and off around the threshold
                        freeze_threshold: >-
                          {{ zone.freeze_protect_outdoor_temp
                             + (2 if heat_pump_mode == 'heat' else 0) }}

                    - choose:
                        # Freeze-risk weather (or outdoor reading missing): rest
                        # the heat pump in heat mode a little below setpoint, so
                        # it is a safety net if Home Assistant goes down.
                        - conditions:
                            - "{{ not is_number(outdoor_temp) or outdoor_temp < freeze_threshold }}"
                          sequence:
                            - action: script.hsc_set_heat_pump
                              data:
                                heat_pump: "{{ zone.heat_pump }}"
                                mode: heat
                                setpoint: "{{ (setpoint - zone.rest_droop + heat_pump_offset) | round(0) | int }}"
                      default:
                        - action: script.hsc_set_heat_pump
                          data:
                            heat_pump: "{{ zone.heat_pump }}"
                            mode: "off"
